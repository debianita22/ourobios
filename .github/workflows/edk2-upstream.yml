# Il passaggio a EDK II di TianoCore (docs/edk2-migration.md):
#   - patches/tianocore e edk2/OuroBiosPkg sono l'EDK2 di MrChromebox di
#     EDK2_MRCHROMEBOX_COMMIT con patches/edk2, file per file
#     (tools/edk2-import.py --check);
#   - il payload di EDK2_UPSTREAM_TAG di tools/build.sh senza patch, poi dal
#     package, in ROM per QEMU q35 con il coreboot di questo albero, e i passi
#     della prova di fumo che non chiedono il setup del progetto
#     (tools/build.sh edk2-upstream, tools/qemu-smoke.py --upstream);
#   - il payload della prima variante di ogni board dal package, quello delle
#     ROM, uguale byte per byte a quello dell'EDK2 di MrChromebox da cui
#     viene (tools/build.sh edk2-parity).
# Non tocca le release: a mano (Run workflow, anche con solo_parity, senza le
# immagini q35) o con un push su un ramo ci-edk2/** (non ci-test/**, che fa
# partire anche build.yml). Schermate, seriale e log negli artifact (14
# giorni).
name: EDK2 upstream

on:
  workflow_dispatch:
    inputs:
      solo_parity:
        description: "Solo il controllo dell'import e edk2-parity, senza le immagini q35"
        type: boolean
        default: false
  push:
    branches: ['ci-edk2/**']

permissions:
  contents: read

concurrency:
  group: edk2-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q35:
    name: Payload di TianoCore in QEMU q35
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # come il job update-test di build.yml, con swtpm per il TPM 1.2
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick \
            libssl-dev pkg-config qemu-system-x86 mtools clang lld nasm xxd swtpm >/dev/null

      - name: coreboot pinnato, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      # un clone dell'EDK2 di MrChromebox a parte (blob:none): le ROM non lo
      # usano piu', il package viene da li'
      - name: patches/tianocore e il package rifatti dall'EDK2 di MrChromebox
        run: python3 tools/edk2-import.py --check work/edk2-mrchromebox

      # ognuno dei tre passi dice il suo esito anche se uno prima non passa
      - name: EDK2 di TianoCore in QEMU
        if: ${{ !cancelled() && !inputs.solo_parity }}
        run: ./tools/build.sh edk2-upstream

      - name: Il payload delle board dal package, contro quello di oggi
        if: ${{ !cancelled() }}
        run: ./tools/build.sh --board all edk2-parity

      - name: Schermate, seriale e log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edk2-upstream-${{ github.sha }}
          path: |
            work/edk2-upstream/
            work/coreboot/build-q35-tianocore*/make.log
            work/coreboot/build-q35-tianocore*/errors.log
            work/coreboot/build-q35-tianocore*/.config
            work/coreboot/build-*-tianocore/make.log
            work/coreboot/build-*-tianocore/errors.log
            work/coreboot/build-*-tianocore/.config
            work/coreboot/build-*-tianocore/UEFIPAYLOAD.fd
            work/coreboot/build-*-mrchromebox/make.log
            work/coreboot/build-*-mrchromebox/errors.log
            work/coreboot/build-*-mrchromebox/.config
            work/coreboot/build-*-mrchromebox/UEFIPAYLOAD.fd
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
