# La build delle ROM di ogni board (boards/*/board.sh) e le loro release.
#
#   tag vX.Y.Z o vX.Y.Z-rcN    build e release: una per variante di ogni
#                              board, vX.Y.Z-mrc e vX.Y.Z-nri (W541),
#                              vX.Y.Z-m920x-fsp (M920x)
#                              (git tag v1.0.0 && git push origin v1.0.0)
#   Run workflow, "version"    lo stesso senza tag a mano: i tag delle
#                              release li crea il job release
#   Run workflow, version      build di prova: niente release, le ROM negli
#   vuota, o push su ci-test/** artifact del run (14 giorni)
#
# Ogni release ha l'immagine completa del flash della board (W541 12 MiB,
# M920x 24 MiB: IFD, GbE, ME, coreboot), le immagini dei due chip per un
# programmatore esterno, la capsula firmata per l'aggiornamento da Linux
# (docs/update.md) e il suo pacchetto fwupd (.cab), il .config, il layout e
# SHA256SUMS; la mrc anche i metadati firmati del remote fwupd
# (configs/fwupd/ourobios.conf), con i .cab di tutte le board, che il remote
# scarica dalla release latest.
# tools/verify-rom.sh blocca la release se i byte prima della regione BIOS
# non sono quelli attesi dalla board (W541: i primi 5 MiB identici a
# legacy/coreboot-4.22/coreboot.rom; M920x: lo SHA-256 dei primi 12 MiB in
# boards/m920x/intel.sha256) o la mappa non e' quella della board. La blocca
# il menu di setup con un'opzione ripetuta o
# mancante (tools/build.sh menu, il record CFR e il suo albero nell'artifact
# smoke-<versione>). La blocca anche la prova di fumo (tools/build.sh smoke):
# il payload EDK2 di ogni variante, in una ROM per QEMU q35, deve partire e
# aprire il setup, che deve rispondere ai tasti, e i suoi servizi runtime
# devono funzionare spostati come li sposta boot.efi di macOS senza
# AvoidRuntimeDefrag; le schermate sono nell'artifact smoke-<versione>. E
# la prova dell'aggiornamento (job update-test, accanto alle ROM:
# tools/build.sh update-test): in QEMU q35,
# con vboot a due slot e il payload EDK2 di queste patch, le capsule devono
# scrivere solo lo slot che non gira, vboot deve provarlo e tornare indietro
# se non si verifica o non parte; dal setup si torna all'altro slot, e una
# voce di boot (boot loader, sistema operativo) non puo'; seriale e
# schermate del setup nell'artifact update-test-<versione>. E la build
# riproducibile (job repro, anche lui accanto alle ROM, e il job compare dopo
# tutti e due): un altro runner costruisce le ROM da capo, coreboot, EDK2,
# iPXE e CSMWrap compresi, e devono essere uguali bit a bit a quelle del job
# build (tools/ci.sh compare: se no, le regioni diverse e i compilatori).
#
# La capsula (e il .cab e i metadati fwupd) si firma con il secret
# CAPSULE_SIGNING_KEY (Settings -> Secrets and variables -> Actions): la
# chiave privata di keys/capsule-signing.pem, che arriva solo al controllo
# delle chiavi del job setup e al passo ROM. Senza, una release vX.Y.Z si
# ferma; le build di prova escono senza capsula.
#
# Gli slot RW di vboot (docs/vboot.md) si firmano con il secret
# VBOOT_SIGNING_KEY: la chiave dati privata (firmware_data_key.vbprivk in
# base64 su una riga) di keys/vboot/firmware_data_key.vbpubk, agli stessi
# due passi. Qui ogni build e' --release, anche quelle di prova: senza il
# secret si ferma al job setup, nel primo minuto (un fork senza i secret
# costruisce con tools/build.sh a mano, con le chiavi di test di vboot).
#
# Quale release e' cosa (tools/ci.sh):
#   - mrc: W541, RAM init con mrc.bin, come la 4.22. "latest" se non e' una
#     pre-release ed e' la versione piu' alta.
#   - nri: W541, RAM init nativa (upstream "[NOT COMPLETE]"): release o
#     pre-release insieme alla mrc dalla v1.3.9 (prima sempre pre-release),
#     mai latest: i metadati del remote fwupd sono nella mrc.
#   - m920x-fsp: ThinkCentre M920x Tiny, RAM init con FSP-M di Intel, dalla
#     v1.4.0 (BOARD_SINCE in boards/m920x/board.sh: con una versione prima
#     --board all lo lascia fuori); mai latest, come la nri.
#   - pre-release tutte con la casella "prerelease" o un trattino nella
#     versione (v1.1.0-rc1); le release vere solo dal ramo principale. Una
#     pre-release provata sulle macchine diventa release senza ricostruirla:
#       gh release edit v1.0.0-mrc --repo debianita22/ourobios --prerelease=false --latest
#       gh release edit v1.0.0-nri --repo debianita22/ourobios --prerelease=false --latest=false
#       gh release edit v1.0.0-m920x-fsp --repo debianita22/ourobios --prerelease=false --latest=false
#   - il job Release si puo' rilanciare: le bozze di un tentativo fallito si
#     cancellano e si rifanno; un tag che c'e' gia' deve essere sul commit della
#     build; con tutte le release gia' pubblicate da quel commit resta solo
#     l'aggiornamento del remote testing.
#
# Il crossgcc di coreboot (i386 con Ada, iasl, nasm: 30-60 minuti) sta nella
# cache di Actions con la chiave di "tools/build.sh toolchain-key": si
# ricostruisce solo quando il pin di coreboot cambia toolchain.
name: Build
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name)
  || inputs.version != '' && format('Release {0}{1}', inputs.version, (inputs.prerelease || contains(inputs.version, '-')) && ' (pre-release)' || '')
  || format('Build di prova ({0})', github.ref_name) }}

on:
  push:
    # solo la versione: i tag delle release (v1.0.0-mrc, v1.0.0-m920x-fsp,
    # ...) non combaciano e non ripartono da soli
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
    branches: ['ci-test/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare (es. v1.0.0). Vuota: build di prova, niente release"
        type: string
        default: ""
      prerelease:
        description: "Pre-release, tutte le varianti (con un trattino nella versione lo sono comunque)"
        type: boolean
        default: false

permissions:
  contents: read

# Una release per versione alla volta: il push del tag e un Run workflow con
# la stessa versione stanno nello stesso gruppo. Un push su un ramo
# ci-test/** ferma la build di prova del push prima sullo stesso ramo.
concurrency:
  group: build-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.version == '' }}

jobs:
  setup:
    name: Versione e controlli
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # la storia intera: una release vera deve stare sul ramo principale
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Versione
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./tools/ci.sh version

      # gli stessi controlli di check.yml: un errore qui costa un minuto
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          pip install -q --break-system-packages actionlint-py
      - name: tools/ci-check.sh
        run: ./tools/ci-check.sh

      # le chiavi dei secret, per ogni build (tutte --release): un secret
      # incollato male o assente si vede qui, in un minuto, non dopo la
      # toolchain
      - name: Chiavi di firma
        env:
          CAPSULE_SIGNING_KEY: ${{ secrets.CAPSULE_SIGNING_KEY }}
          VBOOT_SIGNING_KEY: ${{ secrets.VBOOT_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: ./tools/build.sh --release --version "${VERSION}" keys

  build:
    name: ROM di ogni board
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # gnat: Ada nel crossgcc (libgfxinit); imagemagick e uuid-dev: EDK2;
      # jcat: la firma del pacchetto fwupd; libssl-dev e pkg-config: futility
      # di vboot (libcrypto), che firma gli slot RW; qemu-system-x86: la prova
      # di fumo del payload, con mtools (l'ESP), clang e lld (le applicazioni
      # UEFI che spostano i servizi runtime e provano Secure Boot), sbsigntool
      # (la firma di quest'ultima; lo shim firmato da Microsoft lo scarica
      # build.sh con apt-get download shim-signed), swtpm (il TPM 1.2 e il
      # log delle misure); nasm e xxd: CSMWrap (prepare) e iPXE
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick jcat \
            libssl-dev pkg-config qemu-system-x86 mtools clang lld nasm xxd sbsigntool swtpm >/dev/null
          gcc --version | head -1
          gnatmake --version | head -1

      - name: coreboot ed EDK2 pinnati, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      # salvato subito: una build delle ROM fallita non butta via un'ora di
      # crossgcc
      - name: crossgcc nella cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: ROM
        env:
          CAPSULE_SIGNING_KEY: ${{ secrets.CAPSULE_SIGNING_KEY }}
          VBOOT_SIGNING_KEY: ${{ secrets.VBOOT_SIGNING_KEY }}
        run: ./tools/build.sh --release --board all --version "${VERSION}" roms

      # il menu di setup di ogni variante, costruito sull'host dal codice
      # della build: ogni opzione in una scheda sola (tools/cfr-dump.sh)
      - name: Menu del setup
        run: ./tools/build.sh --release --board all --version "${VERSION}" menu

      - name: Prova di fumo in QEMU
        run: ./tools/build.sh --release --board all --version "${VERSION}" smoke

      - name: Schermate della prova di fumo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ needs.setup.outputs.version }}
          path: |
            work/smoke-*/
            work/menu-*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Riepilogo
        run: |
          shopt -s nullglob
          {
            echo "### ${VERSION}"
            echo
            echo '```'
            (cd dist && sha256sum -- *.rom *.cap *.cab)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: ourobios-${{ needs.setup.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # In parallelo alle ROM: le ROM un'altra volta, da capo, su un altro
  # runner (lo stesso albero, il crossgcc dalla cache, che salva il job
  # build); senza la chiave delle capsule, che non servono (gli slot si
  # firmano con la chiave di vboot, come nel job build: senza, la ROM
  # sarebbe un'altra). Le confronta il job compare
  repro:
    name: ROM da capo su un altro runner
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # come il job build, senza jcat e QEMU
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick \
            libssl-dev pkg-config nasm xxd >/dev/null
          gcc --version | head -1
          gnatmake --version | head -1

      - name: coreboot ed EDK2 pinnati, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      - name: ROM
        env:
          VBOOT_SIGNING_KEY: ${{ secrets.VBOOT_SIGNING_KEY }}
        run: ./tools/build.sh --board all --version "${VERSION}" roms

      - uses: actions/upload-artifact@v7
        with:
          name: repro-${{ needs.setup.outputs.version }}
          path: |
            dist/*.rom
            dist/*.config
            dist/*-layout.txt
          retention-days: 14
          if-no-files-found: error

  # Le ROM del job build e quelle del job repro uguali bit a bit
  compare:
    name: Build riproducibile
    needs: [setup, build, repro]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ourobios-${{ needs.setup.outputs.version }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: repro-${{ needs.setup.outputs.version }}
          path: repro

      - name: Confronto
        run: ./tools/ci.sh compare dist repro

  # In parallelo alle ROM: lo stesso albero, il crossgcc dalla cache (lo
  # salva il job build), un payload EDK2 DEBUG e quattro ROM per q35
  update-test:
    name: Aggiornamento A/B in QEMU
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # come il job build, senza jcat; mtools: l'ESP delle capsule su disco;
      # clang e lld: l'applicazione UEFI che fa da sistema operativo; nasm e
      # xxd: CSMWrap, che prepare compila anche qui
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick \
            libssl-dev pkg-config qemu-system-x86 mtools clang lld nasm xxd >/dev/null

      - name: coreboot ed EDK2 pinnati, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      - name: Prova dell'aggiornamento in QEMU
        run: ./tools/build.sh update-test

      - name: Seriale della prova
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-test-${{ needs.setup.outputs.version }}
          path: |
            work/update-test/out/
            work/update-test/qemu-update.log
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Release
    needs: [setup, build, compare, update-test]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # una pubblicazione alla volta, qualunque versione: "latest" e il remote
    # testing si leggono e si riscrivono qui, e due release insieme
    # potrebbero scambiarsi il risultato
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.setup.outputs.version }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # la storia e i tag: le note elencano i commit dall'ultima release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: ourobios-${{ needs.setup.outputs.version }}
          path: dist

      # i file di ogni release, quelli scaricati che si pubblicano: checksum,
      # IFD/GbE/ME della board, capsula e .cab firmati da keys/ e con la ROM,
      # i metadati del remote fwupd con tutti i .cab (tools/ci.sh check)
      - name: Controlli
        run: ./tools/ci.sh check dist

      - name: Pubblica
        run: ./tools/ci.sh publish dist
